# Example only: a task that posts an explicit terminal receipt.
# Adapt the trigger, job, and issue/PR destination to your repository.
#
# IMPORTANT: ChatGPT Research Loop does NOT trust github-actions[bot] by default.
# If you use this producer, explicitly add github-actions[bot] to the repository
# variable CHATGPT_LOOP_AUTHORIZED_ACTORS.

name: Example long task with completion receipt

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  long-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          # Replace this with your real experiment/test/build.
          sleep 2
          echo "result=PASS" >> "$GITHUB_OUTPUT"

      - name: Post explicit completion receipt
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          TASK_RESULT: ${{ steps.task.outputs.result }}
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            // For a real system, bind this to the Issue/PR that owns the task.
            const issue_number = 1;
            const passed = process.env.TASK_RESULT === 'PASS';
            const decision = passed ? 'PASS_EXAMPLE' : 'FAIL_EXAMPLE';
            const body = [
              '<!-- chatgpt-research-loop:receipt-v1 -->',
              `TASK_DECISION=${decision}`,
              `FINAL_HEAD=${process.env.HEAD_SHA}`,
              `NEXT_ACTION=${passed ? 'REVIEW_RESULT' : 'DIAGNOSE_FAILURE'}`,
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number,
              body,
            });
