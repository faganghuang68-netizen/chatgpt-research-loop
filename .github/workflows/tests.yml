name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  receipt-and-security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run parser and security tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  powershell-dry-run-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create synthetic eligible receipt
        shell: powershell
        run: |
          @{
            eligible = $true
            completion_class = "SUCCESS"
            decision = "PASS_SYNTHETIC"
            repository = "example/demo"
            source_resource = "#1"
            source_comment_id = "1"
            source_url = "https://github.com/example/demo/issues/1#issuecomment-1"
            semantic_fingerprint = "sha256:synthetic"
            next_action = "STOP"
          } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\receipt.json" -Encoding UTF8
      - name: Validate wake prompt construction without browser access
        shell: powershell
        env:
          CHATGPT_RESEARCH_BRAIN_URL: https://chatgpt.com/c/synthetic-contract-only
        run: |
          & "$env:GITHUB_WORKSPACE\tools\wake_chatgpt.ps1" `
            -ReceiptJsonPath "$env:RUNNER_TEMP\receipt.json" `
            -DryRun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
